name: Trigger auto deployment for propos-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.PROPOSAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.PROPOSAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.PROPOSAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and deploy Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Dockerfile

          registryUrl: agraniregistry.azurecr.io
          registryUsername: ${{ secrets.PROPOSAPI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.PROPOSAPI_REGISTRY_PASSWORD }}

          containerAppName: propos-api
          resourceGroup: rg-propos

          imageToBuild: agraniregistry.azurecr.io/propos-api:${{ github.sha }}

          yamlConfigPath: ${{ github.workspace }}/.azure/containerapp.yaml
