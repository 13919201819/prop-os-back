name: Deploy propos-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.PROPOSAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.PROPOSAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.PROPOSAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: |
          echo "${{ secrets.PROPOSAPI_REGISTRY_PASSWORD }}" | docker login agraniregistry.azurecr.io \
            --username "${{ secrets.PROPOSAPI_REGISTRY_USERNAME }}" \
            --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -f Dockerfile \
            -t agraniregistry.azurecr.io/propos-api:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push agraniregistry.azurecr.io/propos-api:${{ github.sha }}

      - name: Deploy image to Azure Container App
        run: |
          az containerapp update \
            --name propos-api \
            --resource-group rg-propos \
            --image agraniregistry.azurecr.io/propos-api:${{ github.sha }}
