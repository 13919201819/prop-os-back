properties:
  managedEnvironmentId: /subscriptions/d520f437-d4ca-410b-b233-f011ccdc0a5c/resourceGroups/agrani-rg-registry-1/providers/Microsoft.App/managedEnvironments/agrani-env

  configuration:
    secrets:
      - name: acr-password
        value: ${{ secrets.PROPOSAPI_REGISTRY_PASSWORD }}

    registries:
      - server: agraniregistry.azurecr.io
        username: ${{ secrets.PROPOSAPI_REGISTRY_USERNAME }}
        passwordSecretRef: acr-password

    ingress:
      external: true
      allowInsecure: false
      targetPort: 8000

  template:
    containers:
      - name: propos-api
        image: agraniregistry.azurecr.io/propos-api:latest
